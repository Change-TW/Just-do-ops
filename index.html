<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家事鍍 - 營運管理與報價系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- 頂部導航 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-cyan-600 text-white font-black text-xl px-2.5 py-1 rounded">家事鍍</div>
        <span class="text-sm font-semibold text-slate-600 hidden sm:inline">現場丈量 ‧ 報價生成 ‧ 排程 ‧ 分潤中心</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="switchTab('dashboard')" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium transition bg-cyan-50 text-cyan-700" data-tab="dashboard">
          <i class="fa-solid fa-list-check mr-1"></i>案場排程
        </button>
        <button onclick="switchTab('quote-builder')" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium transition text-slate-600 hover:bg-slate-100" data-tab="quote-builder">
          <i class="fa-solid fa-file-invoice-dollar mr-1"></i>現場報價
        </button>
        <button onclick="switchTab('profit-calc')" class="tab-btn px-3 py-1.5 rounded-lg text-sm font-medium transition text-slate-600 hover:bg-slate-100" data-tab="profit-calc">
          <i class="fa-solid fa-coins mr-1"></i>本月分潤
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- 分頁 1: 案場總覽與預約排程 -->
    <section id="tab-dashboard" class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">案場進度與行事曆排程</h1>
          <p class="text-sm text-slate-500 mt-1">登記丈量與施作時間，一鍵下載 TimeTree 相容檔 (.ics) 或進行狀態切換</p>
        </div>
        <button onclick="createNewJobPrompt()" class="bg-cyan-600 hover:bg-cyan-700 text-white font-medium px-4 py-2.5 rounded-xl transition flex items-center justify-center space-x-2 shadow-sm">
          <i class="fa-solid fa-plus"></i>
          <span>新增丈量案場</span>
        </button>
      </div>

      <!-- 案件列表 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
          <span class="font-bold text-slate-700">進行中案場</span>
          <span id="job-count-badge" class="text-xs bg-cyan-100 text-cyan-800 px-2.5 py-0.5 rounded-full font-semibold">0 件</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
              <tr>
                <th class="p-4">單號
